<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File/Folders Live Edit PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial, sans-serif; margin: 2em; background: #f7f7f7; }
        #fileList { width: 300px; background: #e9e9e9; padding: 1em; float: left; margin-right: 2em; height: 350px; overflow-y: auto; }
        #editor { margin-left: 320px; }
        textarea { width: 100%; height: 300px; margin-top: 10px; font-size: 1rem; }
        button { margin: 5px; padding: 10px 20px; font-size: 1rem; }
        input[type="text"] { width: 200px; }
    </style>
</head>
<body>
    <h1>Live Edit Files & Folders (PWA Example)</h1>
    <button id="openFolderBtn">Open Folder</button>

    <div id="fileList"></div>
    <div id="editor" style="display:none;">
        <input type="text" id="filename" placeholder="File name" />
        <button id="saveBtn">Save Changes</button>
        <button id="deleteBtn">Delete File</button>
        <textarea id="fileContent" placeholder="File content..."></textarea>
    </div>

    <script>
    // Service Worker registration for offline PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
            console.log('Service Worker registered.', reg);
        });
    }

    // DOM references
    const openFolderBtn = document.getElementById('openFolderBtn');
    const fileListDiv = document.getElementById('fileList');
    const editorDiv = document.getElementById('editor');
    const fileContent = document.getElementById('fileContent');
    const filename = document.getElementById('filename');
    const saveBtn = document.getElementById('saveBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    // Persistent handles
    let folderHandle = null;
    let currentFileHandle = null;
    let fileHandles = {};

    // Open a folder and list files
    openFolderBtn.onclick = async () => {
        if (window.showDirectoryPicker) {
            folderHandle = await window.showDirectoryPicker();
            fileHandles = {};
            fileListDiv.innerHTML = '<b>Files:</b><br><br>';
            for await (const entry of folderHandle.values()) {
                if (entry.kind === 'file') {
                    fileHandles[entry.name] = entry;
                    const fileBtn = document.createElement('button');
                    fileBtn.textContent = entry.name;
                    fileBtn.onclick = () => openFile(entry);
                    fileListDiv.appendChild(fileBtn);
                    fileListDiv.appendChild(document.createElement('br'));
                }
            }
        } else {
            alert('Your browser does not support the File System Access API.');
        }
    };

    // Open a file for editing
    async function openFile(fileHandle) {
        currentFileHandle = fileHandle;
        filename.value = fileHandle.name;
        const file = await fileHandle.getFile();
        fileContent.value = await file.text();
        editorDiv.style.display = 'block';
    }

    // Save edits "live" to file
    saveBtn.onclick = async () => {
        if (currentFileHandle) {
            const writable = await currentFileHandle.createWritable();
            await writable.write(fileContent.value);
            await writable.close();
            alert('Changes saved!');
        }
    };

    // Delete file
    deleteBtn.onclick = async () => {
        if (folderHandle && currentFileHandle) {
            await folderHandle.removeEntry(currentFileHandle.name);
            editorDiv.style.display = 'none';
            openFolderBtn.onclick(); // refresh file list
            alert('File deleted!');
        }
    };
    </script>
</body>
</html>
